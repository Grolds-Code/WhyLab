[project]
name = "whylab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "mcp>=2,<3",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "modal>=1.6.1",
    "pytest>=9.1.1",
]

[project.scripts]
whylab-mcp = "whylab.mcp.server:main"

[tool.uv]
package = true
